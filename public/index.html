<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conformité AI Act & RGPD</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --mut:#78716c; --card:#fff; --bd:#e7e5e4; --ac:#1d4ed8;
          --crit:#b91c1c; --maj:#c2410c; --min:#a16207; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#fafaf9; --mut:#a8a29e; --card:#292524; --bd:#44403c; --ac:#60a5fa;
          --crit:#f87171; --maj:#fb923c; --min:#facc15; --ok:#4ade80; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif }
  main { max-width:820px; margin:0 auto; padding:24px 16px 64px } h1 { font-size:1.5rem; margin:0 0 4px } h2 { font-size:1.05rem; margin:0 0 8px }
  p.sub { color:var(--mut); margin:0 0 20px }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:14px }
  input, textarea { width:100%; padding:9px 10px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; margin:4px 0 12px }
  textarea { min-height:110px; resize:vertical } label { font-size:.85rem; color:var(--mut) }
  button { background:var(--ac); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; cursor:pointer } button:disabled { opacity:.5 }
  .verdict { font-size:1.25rem; font-weight:600 } .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:.8rem; border:1px solid currentColor }
  .critique { color:var(--crit) } .majeur { color:var(--maj) } .mineur { color:var(--min) } .ok { color:var(--ok) }
  ul { padding-left:20px; margin:6px 0 } li { margin:3px 0 } small, .mut { color:var(--mut) }
  table { width:100%; border-collapse:collapse } td { padding:4px 6px; border-bottom:1px solid var(--bd); vertical-align:top; font-size:.9rem }
  .err { color:var(--crit) }
</style>
</head>
<body>
<main>
  <h1>Conformité AI Act & RGPD</h1>
  <p class="sub">Analyse d'un dépôt GitHub public ou d'une description de projet. Un seul appel IA (≤ 50 000 tokens) ; les conclusions sont calculées par des règles, pas par le modèle.</p>

  <form class="card" id="f">
    <label for="repo">Dépôt GitHub public</label>
    <input id="repo" placeholder="https://github.com/proprietaire/depot">
    <label for="doc">… ou décrivez le projet / collez sa documentation</label>
    <textarea id="doc" placeholder="Finalité, données traitées, modèles/API utilisés, hébergement, utilisateurs, décisions automatisées…"></textarea>
    <div id="codebox" hidden><label for="code">Code d'accès</label><input id="code" type="password" autocomplete="off"></div>
    <button id="go">Analyser</button> <small id="status" class="mut"></small>
  </form>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const list = a => a.length ? "<ul>" + a.map(x => "<li>" + x + "</li>").join("") + "</ul>" : "<p class='mut'>Aucun.</p>";
const VCLASS = { interdit:"critique", non_conforme_probable:"critique", a_corriger:"majeur", plutot_conforme:"ok", indetermine:"mut" };

fetch("/api/analyze").then(r => r.json()).then(j => { $("codebox").hidden = !j.needs_code; }).catch(() => {});

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const repo = $("repo").value.trim(), doc = $("doc").value.trim();
  if (!repo && !doc) return;
  $("go").disabled = true; $("status").textContent = "Analyse en cours (10 à 40 s)…"; $("out").innerHTML = "";
  try {
    const r = await fetch("/api/analyze", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ repo: repo || undefined, doc: repo ? undefined : doc, access_code: $("code").value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    render(j); $("status").textContent = "";
  } catch (err) { $("status").textContent = ""; $("out").innerHTML = "<p class='err'>" + esc(err.message) + "</p>"; }
  $("go").disabled = false;
});

function render(r) {
  if (r.dry_run) { $("out").innerHTML = "<p>Aucun fichier exploitable trouvé.</p>"; return; }
  const ai = r.ai_act, rg = r.rgpd, m = r.meta, lv = rg.maturity.levels;
  const fnd = rg.findings.map(x => `<span class="badge ${x.severity}">${x.severity}</span> ${esc(x.text)} <small>(${esc(x.ref)}${x.evidence ? " · " + esc(x.evidence) : ""})</small>`);
  const obl = ai.obligations.map(o => `<b>${esc(o.ref)}</b> — ${esc(o.label)}`);
  $("out").innerHTML = `
  <div class="card"><div class="verdict ${VCLASS[r.verdict]}">${esc(r.verdict_label)}</div>
    <p class="mut">Couverture des faits clés : ${Math.round(r.coverage * 100)} % · ${m.files_included}/${m.files_total} fichiers analysés ·
    ${m.usage ? m.usage.total_tokens : "?"} tokens</p><p><small>${esc(r.disclaimer)}</small></p></div>
  <div class="card"><h2>AI Act — ${esc(ai.label)}</h2><p class="mut">Rôle(s) : ${esc(ai.roles.join(", ") || "non déterminé")}</p>
    <h2>Obligations</h2>${list(obl)}
    <details><summary>Parcours du flowchart</summary><table>${ai.path.map(p => `<tr><td><b>${esc(p.step)}</b></td><td>${esc(p.answer)}<br><small>${esc(p.why)}</small></td></tr>`).join("")}</table></details>
    ${ai.notes.map(n => `<p><small>${esc(n)}</small></p>`).join("")}</div>
  <div class="card"><h2>RGPD</h2>
    <p class="mut">${rg.applicable === false ? "Aucune donnée personnelle détectée." : "AIPD " + (rg.aipd_required ? "probablement requise" : "non déclenchée") + (rg.criteria.length ? " — critères : " + esc(rg.criteria.join(", ")) : "")}</p>
    ${list(fnd)}
    <h2>Maturité CNIL (0-5)</h2><table>${Object.entries(lv).map(([k, v]) => `<tr><td>${esc(k)}</td><td><b>${v.level ?? "?"}</b></td><td><small>${esc(v.e || "non évaluable depuis le dépôt")}</small></td></tr>`).join("")}</table></div>
  ${r.to_verify.length ? `<div class="card"><h2>À vérifier</h2>${list(r.to_verify.map(esc))}</div>` : ""}
  ${r.missing_info.length ? `<div class="card"><h2>Questions au porteur du projet</h2>${list(r.missing_info.map(esc))}</div>` : ""}`;
}
</script>
</body>
</html>
